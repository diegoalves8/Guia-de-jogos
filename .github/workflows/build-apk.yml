# Gera o APK automaticamente a cada push na branch main (ou manualmente).
# O APK fica em: Actions → execução → seção "Artifacts" → GuiaDeJogos-apk.
# Criando uma tag "v1.0.0", o APK também é publicado em Releases.
name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Validar JSON de conteúdo
        run: |
          for f in $(find app/src/main/assets/content -name '*.json'); do
            python3 -m json.tool "$f" > /dev/null || { echo "JSON inválido: $f"; exit 1; }
          done

      - name: Verificar imagens do conteúdo
        run: python3 tools/check_images.py

      - name: Build APK (debug e release)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Renomear APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/GuiaDeJogos-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/GuiaDeJogos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GuiaDeJogos-apk
          path: out/*.apk

      - name: Número da versão
        run: |
          echo "VC=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VN=1.4.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' | head -c 1500 > notes.txt

      # Toda alteração na main publica uma versão nova. O app encontra essa versão
      # na aba "Atualizar" e se atualiza sozinho.
      - name: Publicar versão para atualização dentro do app
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.VC }}
          name: Guia de Jogos ${{ env.VN }}
          body_path: notes.txt
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/GuiaDeJogos.apk
